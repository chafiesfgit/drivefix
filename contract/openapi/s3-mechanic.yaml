openapi: 3.0.3
info:
  title: DriveFix Mechanic
  version: 1.1.0
  description: Mechanic profiles, services and prices, slots, bookings, reviews.
servers:
- url: http://localhost:4003/api/v1
tags:
- name: S3
paths:
  /mechanics:
    get:
      summary: Approved and active mechanics
      tags:
      - S3
      description: 'Roles: anyone (no token)'
      security: []
      parameters:
      - name: wilaya
        in: query
        schema:
          type: string
      - name: specialty
        in: query
        schema:
          type: string
      - name: atClient
        in: query
        schema:
          type: boolean
      - name: minRating
        in: query
        schema:
          type: number
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Paged list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MechanicProfile'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
  /mechanics/{id}:
    get:
      summary: Profile, services, reviews
      tags:
      - S3
      description: 'Roles: anyone (no token)'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: object
                  services:
                    type: array
                    items:
                      type: object
                  reviews:
                    type: array
                    items:
                      type: object
                required:
                - profile
                - services
                - reviews
        '404':
          description: NOT_FOUND (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /mechanics/{id}/slots:
    get:
      summary: Free slots for a day
      tags:
      - S3
      description: 'Roles: anyone (no token)'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: query
        schema:
          type: string
          format: date
      - name: serviceId
        in: query
        required: false
        description: 'v1.1, optional: slot length = this service''s durationMin (default: the shortest active service)'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  slots:
                    type: array
                    items:
                      type: string
                required:
                - date
                - slots
        '404':
          description: NOT_FOUND (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /mechanics/me:
    put:
      summary: Create or update own profile
      tags:
      - S3
      description: 'Roles: MECHANIC (approved)'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                garageName:
                  type: string
                wilaya:
                  type: string
                address:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                specialties:
                  type: array
                  items:
                    type: string
                workingHours:
                  type: object
                offersMobile:
                  type: boolean
                bio:
                  type: string
              required:
              - garageName
              - wilaya
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MechanicProfile'
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /mechanics/me/services:
    get:
      summary: Own services
      tags:
      - S3
      description: 'Roles: MECHANIC'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                required:
                - items
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a service
      tags:
      - S3
      description: 'Roles: MECHANIC (approved)'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: integer
                durationMin:
                  type: integer
              required:
              - name
              - price
              - durationMin
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /mechanics/me/services/{id}:
    patch:
      summary: Edit a service
      tags:
      - S3
      description: 'Roles: MECHANIC'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: integer
                durationMin:
                  type: integer
                active:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: NOT_FOUND (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a service
      tags:
      - S3
      description: 'Roles: MECHANIC'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: NOT_FOUND (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings:
    post:
      summary: Book a service
      tags:
      - S3
      description: 'Roles: DRIVER'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mechanicId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                place:
                  type: string
                  enum:
                  - GARAGE
                  - AT_CLIENT
                clientAddress:
                  type: string
                vehicle:
                  type: string
                note:
                  type: string
              required:
              - mechanicId
              - serviceId
              - date
              - startTime
              - place
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: STATE_CONFLICT (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: BUSINESS_RULE (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Own bookings
      tags:
      - S3
      description: 'Roles: DRIVER, MECHANIC'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Paged list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/status:
    patch:
      summary: Accept, reject, start, finish, cancel
      tags:
      - S3
      description: 'Roles: MECHANIC, DRIVER'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - CONFIRMED
                  - REJECTED
                  - IN_PROGRESS
                  - DONE
                  - CANCELLED
                reason:
                  type: string
              required:
              - status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: NOT_FOUND (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: STATE_CONFLICT (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: BUSINESS_RULE (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/review:
    post:
      summary: One review per DONE booking
      tags:
      - S3
      description: 'Roles: DRIVER'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                comment:
                  type: string
              required:
              - rating
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  rating:
                    type: integer
                required:
                - id
                - rating
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: STATE_CONFLICT (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: BUSINESS_RULE (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: OTP_EXPIRED
            message:
              type: string
            field:
              type: string
          required:
          - code
          - message
    MechanicProfile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        garageName:
          type: string
        wilaya:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        specialties:
          type: array
          items:
            type: string
        workingHours:
          type: object
        offersMobile:
          type: boolean
        bio:
          type: string
        rating:
          type: number
      required:
      - userId
      - garageName
      - wilaya
      - offersMobile
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mechanicId:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        durationMin:
          type: integer
        active:
          type: boolean
      required:
      - id
      - mechanicId
      - name
      - price
      - durationMin
      - active
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        mechanicId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        price:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
        place:
          type: string
          enum:
          - GARAGE
          - AT_CLIENT
        clientAddress:
          type: string
        vehicle:
          type: string
        note:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - IN_PROGRESS
          - DONE
          - REJECTED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - driverId
      - mechanicId
      - serviceId
      - price
      - date
      - startTime
      - place
      - status
      - createdAt
