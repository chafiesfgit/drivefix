openapi: 3.0.3
info:
  title: DriveFix Notification
  version: 1.1.0
  description: In-app notifications and mock SMS. Callers use a 2 s timeout and ignore failures.
servers:
- url: http://localhost:4006/api/v1
tags:
- name: S6
paths:
  /notifications:
    post:
      summary: Create from type + variables (templates per language)
      tags:
      - S6
      description: 'Roles: service-to-service (X-Service-Key header)'
      security:
      - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                type:
                  type: string
                variables:
                  type: object
                language:
                  type: string
                  enum:
                  - ar
                  - fr
                  - en
              required:
              - userId
              - type
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Own notifications, newest first
      tags:
      - S6
      description: 'Roles: any authenticated user'
      security:
      - bearerAuth: []
      parameters:
      - name: unread
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Paged list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sms:
    post:
      summary: 'Mock SMS: print to console and save to sms_log'
      tags:
      - S6
      description: 'Roles: service-to-service (X-Service-Key header)'
      security:
      - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                text:
                  type: string
              required:
              - phone
              - text
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                required:
                - id
                - status
        '400':
          description: VALIDATION_ERROR (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notifications/unread-count:
    get:
      summary: Bell badge number
      tags:
      - S6
      description: 'Roles: any authenticated user'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                - count
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notifications/{id}/read:
    patch:
      summary: Mark as read
      tags:
      - S6
      description: 'Roles: any authenticated user'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: NOT_FOUND (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notifications/read-all:
    post:
      summary: Mark all as read
      tags:
      - S6
      description: 'Roles: any authenticated user'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No content
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/sms-log:
    get:
      summary: Last SMS sent (read the OTP in the demo)
      tags:
      - S6
      description: 'Roles: ADMIN'
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                required:
                - items
        '403':
          description: FORBIDDEN (stable error.code, see README)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: OTP_EXPIRED
            message:
              type: string
            field:
              type: string
          required:
          - code
          - message
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - userId
      - type
      - title
      - body
      - read
      - createdAt
